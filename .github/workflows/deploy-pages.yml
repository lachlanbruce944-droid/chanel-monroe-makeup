# Publishes the lightweight site (the site/ folder) to GitHub Pages on every push to main.
# Photos and clips are not in this repo: they are served from Supabase Storage (bucket "media").
# Two jobs (GitHub's recommended layout): the upload finishes and registers before the deploy job looks for it,
# which avoids the intermittent "No artifacts named github-pages were found" failures seen on 25 Nov 2026.
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
