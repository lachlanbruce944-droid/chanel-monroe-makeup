<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2eee8">
<title>Suggest an improvement · Chanel Monroe Makeup</title>
<style>
:root{color-scheme:light;font:16px/1.6 system-ui,sans-serif;color:#26221f;background:#f2eee8}
*{box-sizing:border-box}body{margin:0;padding:24px 18px 48px}main{max-width:560px;margin:0 auto}a{color:inherit}h1{font:normal 36px/1.15 Georgia,serif;margin:30px 0 16px}p{color:#62584f}form{padding:24px;border-radius:22px;background:#faf7f3;border:1px solid #ddd3c7}label{display:block;font-weight:600;margin:16px 0 8px}select,textarea,button{font:inherit;width:100%;border:1px solid #b7a99b;border-radius:12px;padding:12px;background:white;color:inherit}textarea{resize:vertical;min-height:160px}button{margin-top:20px;background:#342d2b;color:white;cursor:pointer}button:disabled{opacity:.65;cursor:wait}:focus-visible{outline:3px solid #956b48;outline-offset:3px}.note{font-size:14px}.trap{display:none}#status{margin-bottom:0;min-height:1.6em}#status[data-error]{color:#a02020}
</style>
</head>
<body>
<main>
<a href="index.html">Back to website</a>
<h1>Help shape the website</h1>
<p>Have an idea to make browsing or enquiring easier? I’d love to hear it.</p>
<form id="suggestionForm">
<label for="category">What is your suggestion about?</label>
<select id="category" name="category" required>
<option value="">Choose an option</option>
<option value="design">Design and layout</option>
<option value="navigation">Finding your way around</option>
<option value="booking">Enquiry and booking form</option>
<option value="content">Photos and information</option>
<option value="other">Something else</option>
</select>
<label for="message">Your suggestion</label>
<textarea id="message" name="message" required minlength="10" maxlength="2000" placeholder="What would you improve, and how would it help?"></textarea>
<p class="note">10–2,000 characters. No name or email needed. Please leave out personal or booking details. Suggestions are private; for a booking, use Enquire.</p>
<div class="trap" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<button id="sendSuggestion" type="submit">Send suggestion</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
</main>
<script>
(function(){
  var form=document.getElementById('suggestionForm'),button=document.getElementById('sendSuggestion'),status=document.getElementById('status'),busy=false;
  form.addEventListener('submit',async function(e){
    e.preventDefault();if(busy||!form.reportValidity())return;
    var category=form.elements.category.value,message=form.elements.message.value.trim();
    if(form.elements.website.value)return;
    if(message.length<10){status.textContent='Please add a little more detail (at least 10 characters).';status.dataset.error='1';return}
    busy=true;button.disabled=true;button.textContent='Sending…';delete status.dataset.error;status.textContent='';
    try{
      var response=await fetch('https://qxiugfatpybldluipcyy.supabase.co/rest/v1/website_suggestions',{
        method:'POST',headers:{apikey:'sb_publishable_sGLIpIxvos66FLVI9vPSbg_qXsTT6rt','Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify({category:category,message:message,source:'mobile_navigation'}),signal:AbortSignal.timeout(15000)
      });
      if(!response.ok)throw new Error('Suggestion was not saved');
      form.reset();status.textContent='Thank you! Your suggestion has been saved.';
    }catch(error){status.dataset.error='1';status.textContent='We couldn’t confirm your suggestion was saved. Your text is still here so you can try again.'}
    finally{busy=false;button.disabled=false;button.textContent='Send suggestion'}
  });
})();
</script>
</body>
</html>
