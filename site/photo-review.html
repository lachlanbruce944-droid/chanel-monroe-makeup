const key='chanel-about-photo-choices-v1';let choices={};try{choices=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}
const grid=document.querySelector('#grid'),summary=document.querySelector('#summary'),filter=document.querySelector('#filter'),dialog=document.querySelector('dialog');
function sync(){const keep=photos.filter(p=>choices[p.id]==='keep').map(p=>p.id),remove=photos.filter(p=>choices[p.id]==='remove').map(p=>p.id);summary.value='Chanel About photo review (stable review IDs)\nKeep: '+(keep.join(', ')||'none selected')+'\nRemove: '+(remove.join(', ')||'none selected')+'\nUnmarked photos: leave unchanged.';document.querySelector('#status').textContent=keep.length+' keep · '+remove.length+' remove · '+(photos.length-keep.length-remove.length)+' not reviewed';}
function save(){try{localStorage.setItem(key,JSON.stringify(choices))}catch{document.querySelector('#notice').textContent='Browser saving is unavailable. Copy your selection before leaving.'}sync()}
function render(){grid.replaceChildren();for(const p of photos){const choice=choices[p.id];if(filter.value==='chanel'&&!p.labelled||filter.value==='keep'&&choice!=='keep'||filter.value==='remove'&&choice!=='remove'||filter.value==='unreviewed'&&choice)continue;const card=document.createElement('article');card.dataset.choice=choice||'';const preview=document.createElement('button');preview.className='preview';preview.setAttribute('aria-label','Enlarge photo '+p.id);const img=document.createElement('img');img.loading='lazy';img.src=p.url.replace(/\.webp$/,'.m.webp');img.alt='Review photo '+p.id;img.onerror=()=>{img.onerror=null;img.src=p.url};preview.append(img);preview.onclick=()=>{document.querySelector('#photo-title').textContent='Photo '+p.id;document.querySelector('#full').src=p.url;document.querySelector('#full').alt=img.alt;document.querySelector('#post').href=p.post;dialog.showModal()};const meta=document.createElement('div');meta.className='meta';const title=document.createElement('strong');title.textContent='Photo '+p.id;const label=document.createElement('small');label.textContent=p.labelled?'Chanel · owner labelled':'Chanel’s work';const actions=document.createElement('div');actions.className='choices';for(const value of ['keep','remove']){const b=document.createElement('button');b.textContent=value==='keep'?'Keep':'Remove';b.setAttribute('aria-label',b.textContent+' photo '+p.id);b.setAttribute('aria-pressed',String(choice===value));b.onclick=()=>{if(choices[p.id]===value)delete choices[p.id];else choices[p.id]=value;save();render()};actions.append(b)}meta.append(title,label,actions);card.append(preview,meta);grid.append(card)}if(!grid.children.length){const p=document.createElement('p');p.textContent='No photos in this selection yet.';grid.append(p)}sync()}
filter.onchange=render;document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary.value);document.querySelector('#notice').textContent='Copied. Paste this selection into chat.'}catch{summary.focus();summary.select();document.querySelector('#notice').textContent='Select and copy the text below, then paste it into chat.'}};render();
